<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Corrector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 300px;
      background: #fff;
      color: #111;
    }
    .header {
      background: #111;
      color: #fff;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header svg { flex-shrink: 0; }
    .header-text { font-size: 15px; font-weight: 600; }
    .header-sub { font-size: 12px; color: #aaa; margin-top: 2px; }
    .body { padding: 18px; }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .input-wrap { position: relative; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 9px 36px 9px 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      color: #111;
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #6366f1; background: #fff; }
    .toggle-vis {
      position: absolute;
      right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer; color: #aaa; font-size: 16px; line-height: 1;
    }
    .save-btn {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #333; }
    .save-btn:disabled { background: #aaa; cursor: default; }
    .status {
      margin-top: 10px;
      font-size: 13px;
      text-align: center;
      min-height: 18px;
      color: #16a34a;
    }
    .status.err { color: #dc2626; }
    .shortcut-box {
      margin-top: 18px;
      background: #f3f4f6;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .shortcut-box p { font-size: 12px; color: #555; line-height: 1.6; }
    kbd {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
      font-family: monospace;
      box-shadow: 0 1px 0 #bbb;
    }
    .link {
      display: block;
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #6366f1;
      text-decoration: none;
    }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </svg>
    <div>
      <div class="header-text">Email Corrector</div>
      <div class="header-sub">Powered by Claude AI</div>
    </div>
  </div>

  <div class="body">
    <label for="apiKey">Anthropic API key</label>
    <div class="input-wrap">
      <input type="password" id="apiKey" placeholder="sk-ant-…" autocomplete="off" />
      <button class="toggle-vis" id="toggleVis" title="Show/hide key">👁</button>
    </div>
    <button class="save-btn" id="saveBtn">Save key</button>
    <div class="status" id="status"></div>

    <div class="shortcut-box">
      <p>While typing in any email field, press:</p>
      <p style="margin-top:6px;">
        <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Space</kbd>
        <span style="color:#888"> (Mac: ⌘⇧Space)</span>
      </p>
      <p style="margin-top:6px;">Claude will correct your email and show you a preview before applying changes.</p>
    </div>

    <a class="link" href="chrome://extensions/shortcuts" target="_blank">Change shortcut →</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
